name: CI

on:
  push:
  pull_request:
    branches: [ "main", "tile-downloader" ]

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ccache \
          extra-cmake-modules \
          libcurl4-openssl-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libglm-dev \
          libgmp-dev \
          libjpeg-dev \
          libmpfr-dev \
          libpng-dev \
          libsqlite3-dev \
          libtbb-dev \
          libtiff-dev \
          libwayland-bin \
          libwayland-dev \
          libxkbcommon-dev \
          ninja-build \
          pkg-config \
          sqlite3 \
          wayland-protocols \
          xorg-dev \
          zlib1g-dev

    - name: Restore installed CMake dependencies
      id: cmake_dependency_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          build/alp_external/boost
          build/alp_external/proj
          build/alp_external/gdal
          build/alp_external/cgal
          build/alp_external/opencv
        key: ${{ runner.os }}-alp-installs-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-alp-installs-${{ env.BUILD_TYPE }}-

    - name: Restore ccache
      id: ccache_cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref_name }}-
          ${{ runner.os }}-ccache-

    - name: Configure ccache
      run: |
        ccache --max-size="${CCACHE_MAXSIZE}"
        ccache --zero-stats

    - name: Configure CMake
      run: >
        cmake
        -S "${{ github.workspace }}"
        -B "${{ github.workspace }}/build"
        -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Save installed CMake dependencies
      if: steps.cmake_dependency_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          build/alp_external/boost
          build/alp_external/proj
          build/alp_external/gdal
          build/alp_external/cgal
          build/alp_external/opencv
        key: ${{ runner.os }}-alp-installs-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'cmake/*.cmake') }}

    - name: Build all targets
      run: cmake --build "${{ github.workspace }}/build" --config ${{ env.BUILD_TYPE }} --parallel --target all

    - name: ccache stats
      if: always()
      run: ccache --show-stats

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Cache unit test data
      id: terrain_builder_unittest_data
      uses: actions/cache@v4
      with:
        path: unittests/data
        key: terrain-builder-unittest-data-v1

    - name: Download unit test data
      if: steps.terrain_builder_unittest_data.outputs.cache-hit != 'true'
      run: wget -qO- https://gataki.cg.tuwien.ac.at/raw/terrain_builder_unittest_data.tar.gz | tar xz -C unittests

    - name: Run unit tests
      working-directory: ${{ github.workspace }}/build
      run: |
        export LD_LIBRARY_PATH="${{ github.workspace }}/build/alp_external/proj/lib:${{ github.workspace }}/build/alp_external/proj/lib64:${{ github.workspace }}/build/alp_external/gdal/lib:${{ github.workspace }}/build/alp_external/gdal/lib64:${{ github.workspace }}/build/alp_external/opencv/lib:${{ github.workspace }}/build/alp_external/opencv/lib64:${{ github.workspace }}/build/alp_external/boost/lib:${{ github.workspace }}/build/alp_external/boost/lib64:${LD_LIBRARY_PATH:-}"
        ./unittests/unittests_terrainlib "~mesh::clip_on_bounds benchmark"
        ./unittests/unittests_tilebuilder
        ./unittests/unittests_meshbuilder
        ./unittests/unittests_dagbuilder
        ./unittests/unittests_sfmerger
